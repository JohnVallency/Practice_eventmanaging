services:
  postgres:
    image: postgres:16-alpine
    container_name: eventlms-postgres
    environment:
      POSTGRES_USER: eventlms
      POSTGRES_PASSWORD: eventlms
      POSTGRES_DB: eventlms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventlms -d eventlms"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: eventlms-backend
    environment:
      PROJECT_NAME: "EventLMS API"
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: eventlms
      POSTGRES_PASSWORD: eventlms
      POSTGRES_DB: eventlms
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: eventlms-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
