server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # SPA-fallback: все маршруты отдаём через index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хешированные Vite-ассеты кешируем агрессивно
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html никогда не кешируем, чтобы деплой подхватывался сразу
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
